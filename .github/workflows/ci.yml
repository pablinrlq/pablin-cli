name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m pablin_cli --version
      - run: python -m pablin_cli --demo --check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -e ".[dev]"
      - run: python -m bandit -q -r src -ll -ii
      - run: python -m pip_audit . --strict
      - run: python -m pip_audit --skip-editable
      - run: python -m compileall -q src
      - run: python -m build
      - run: python -m twine check dist/*
