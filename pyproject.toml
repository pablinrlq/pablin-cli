[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pablin-cli"
version = "0.1.0"
description = "Uma interface visual, guiada e segura para a AWS CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Pablo" },
]
keywords = ["aws", "aws-cli", "cloud", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=8.2.8,<9",
]

[project.urls]
Homepage = "https://github.com/pablinrlq/pablin-cli"
Repository = "https://github.com/pablinrlq/pablin-cli.git"
Issues = "https://github.com/pablinrlq/pablin-cli/issues"
Changelog = "https://github.com/pablinrlq/pablin-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "pytest>=8,<10",
  "twine>=6.2,<7",
]

[project.scripts]
pablin = "pablin_cli.__main__:main"
easyaws = "pablin_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
